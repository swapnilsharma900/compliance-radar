spring.application.name=ComplianceRadar

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/compliance_radar
spring.datasource.username=springadmin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Init scripts (embedded mode — runs schema.sql and data.sql only on fresh DB)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JWT
jwt.secret=5a7b9c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b
jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173

# Logging
logging.level.in.complianceradar=DEBUG

# Swagger
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.oauth2-redirect-url=/swagger-ui/oauth2-redirect.html
springdoc.swagger-ui.custom-js-url=/swagger-auto-auth.js